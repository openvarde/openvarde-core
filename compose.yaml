services:
  core:
    build: .
    container_name: openvarde-core
    restart: unless-stopped

    network_mode: host

    environment:
      MQTT_URL: mqtt://127.0.0.1:1883
      PORT: 8081

    volumes:
      - openvarde-data:/var/lib/openvarde

volumes:
  openvarde-data:
    name: openvarde-data
